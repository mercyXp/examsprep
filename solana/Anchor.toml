[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
examsprep = "Ebo9c8SiwLx37wXejAwQmx1vLv1YtR8kYVb2Lb6V8FVH"

[programs.devnet]
examsprep = "Ebo9c8SiwLx37wXejAwQmx1vLv1YtR8kYVb2Lb6V8FVH"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

# Copy the committed program keypair into the place Anchor expects before every build,
# so the program id stays the address published in the README.
[hooks]
pre-build = "mkdir -p target/deploy && cp keys/examsprep-program.json target/deploy/examsprep-keypair.json"
